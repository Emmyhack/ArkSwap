# ArkSwap V1 — Foundry configuration
#
# NOTE ON COMPILER VERSIONS
# -------------------------
# ArkSwap V1 is a minimal semantic fork of Uniswap V2. Upstream compiler
# versions are preserved deliberately (llm.txt s4, s17, s54):
#
#   contracts/core/*       pragma solidity =0.5.16   (Uniswap V2 Core)
#   contracts/periphery/*  pragma solidity =0.6.6    (Uniswap V2 Periphery)
#   test/*, script/*       pragma solidity ^0.8.24   (Foundry test harness)
#
# `auto_detect_solc` lets a single source tree compile each file with the exact
# version its pragma pins. Because 0.5.x/0.6.x sources cannot be imported from
# a 0.8.x test file, the test suite talks to core/periphery through locally
# declared interfaces plus `vm.deployCode` / `vm.getCode` against the compiled
# artifacts. This keeps upstream math byte-for-byte unmodified.
#
# NOTE ON evm_version
# -------------------
# Pinned to `istanbul`: the newest EVM target supported by solc 0.5.16, and a
# conservative baseline for Ark Constellation's EVM. Do not raise this without
# recomputing PAIR_INIT_CODE_HASH (llm.txt s7).
#
# NOTE ON DETERMINISM
# -------------------
# optimizer/runs/evm_version/bytecode_hash all feed ArkSwapPair creation code
# and therefore the CREATE2 init-code hash baked into ArkSwapLibrary. Changing
# any of them REQUIRES re-running `make init-code-hash`. `test/core/InitCodeHash.t.sol`
# fails the build if the library constant goes stale.

[profile.default]
src              = "contracts"
out              = "out"
libs             = ["lib"]
test             = "test"
script           = "script"
auto_detect_solc = true
evm_version      = "istanbul"
optimizer        = true
optimizer_runs   = 999999
via_ir           = false
bytecode_hash    = "ipfs"
ffi              = false
# Deployment manifests live in the sibling packages/addresses workspace, so the
# contracts package needs read-write access one level up (llm.txt monorepo map).
fs_permissions   = [
    { access = "read",       path = "./out" },
    { access = "read-write", path = "../addresses" },
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs                  = 256
depth                 = 64
fail_on_revert        = false
call_override         = false
shrink_run_limit      = 5000

# `forge test --profile deep` — pre-deployment gate (llm.txt s21, s22, s53).
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs  = 1024
depth = 256

[fmt]
# The upstream-derived trees are deliberately NOT formatted. `forge fmt` rewrites
# `uint` to `uint256` and restyles Uniswap's original layout, which would bloat the
# diff against v2-core/v2-periphery and make the fork far harder to review against
# upstream. Those files are kept byte-faithful; formatting applies to
# ArkSwap-original code only.
# NOTE: `dir/**` matches nested paths only -- it does NOT match direct children.
# Both patterns are required or the top-level contracts get reformatted.
ignore = [
    "contracts/core/*.sol",
    "contracts/core/**",
    "contracts/periphery/*.sol",
    "contracts/periphery/**",
    "contracts/test/DeflatingERC20.sol",
    "contracts/test/ArkSwapLibraryHarness.sol",
]
line_length      = 120
tab_width        = 4
bracket_spacing  = false
int_types        = "long"
multiline_func_header = "attributes_first"
sort_imports     = true

[rpc_endpoints]
ark = "${ARK_RPC_URL}"

# Blockscout verification is driven entirely from the CLI (see `make verify` and
# llm.txt s36) rather than an [etherscan] block, because the numeric `chain` key
# cannot be resolved from an env var at config-parse time.
#
#   forge verify-contract <addr> <path>:<Name> \
#     --verifier blockscout --verifier-url "$ARK_BLOCKSCOUT_API_URL" \
#     --constructor-args <abi-encoded>
